<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090a17">
  <meta name="description" content="Pilot the last ember through the nebula. Gather sparks, spend your light, and dissolve the shadow.">
  <link rel="icon" href="data:,">
  <title>EMBERLINE — a last light in a dying star</title>
  <style>
    :root {
      color-scheme: dark;
      background: #070811;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #070811;
    }
    body {
      display: grid;
      place-items: center;
      touch-action: none;
      user-select: none;
    }
    canvas {
      display: block;
      width: min(100vw, 177.7778vh);
      height: min(100vh, 56.25vw);
      outline: none;
      background: #090a17;
    }
    #status {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>
<body>
  <canvas id="game" width="960" height="540" aria-label="EMBERLINE game field"></canvas>
  <div id="status" aria-live="polite" aria-atomic="true">Emberline. Title screen. Press Enter or click to begin.</div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
